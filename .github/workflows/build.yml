# CI OWNERSHIP: GitHub Actions
# This workflow owns static code analysis only (SonarQube).
# It runs on every push to main and every pull request.
# It is NOT a deployment pipeline — deployments are handled by Jenkins.
# See Jenkinsfile for the full build/test/deploy lifecycle.

name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:    # Allows manual triggering of the workflow

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}