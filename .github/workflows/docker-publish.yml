name: Docker Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            gmedeirosnet/siproquim:${{ steps.version.outputs.VERSION }}
            gmedeirosnet/siproquim:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag in manifest
        run: |
          sed -i "s|image: gmedeirosnet/siproquim:.*|image: gmedeirosnet/siproquim:${{ steps.version.outputs.VERSION }}|g" manifests/siproquim.yaml

      - name: Commit updated manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update siproquim image to ${{ github.ref_name }}"
          file_pattern: manifests/siproquim.yaml
          branch: main
