name: CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          major_string_token: "release:major"
          minor_string_token: "release:minor"
          patch_string_token: "release:patch"
          default_bump: patch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            gmedeirosnet/siproquim:${{ steps.tag.outputs.new_tag }}
            gmedeirosnet/siproquim:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag in manifest
        run: |
          sed -i "s|image: gmedeirosnet/siproquim:.*|image: gmedeirosnet/siproquim:${{ steps.tag.outputs.new_tag }}|g" manifests/siproquim.yaml

      - name: Commit updated manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update siproquim image to ${{ steps.tag.outputs.new_tag }}"
          file_pattern: manifests/siproquim.yaml
          branch: main
