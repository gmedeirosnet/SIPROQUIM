# ============================================================
# Namespace
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: siproquim

---
# ============================================================
# Secret: database credentials
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: siproquim-db-secret
  namespace: siproquim
type: Opaque
data:
  # echo -n 'admin' | base64    => YWRtaW4=
  # echo -n 'password' | base64 => cGFzc3dvcmQ=
  DB_USER: YWRtaW4=
  DB_PASSWORD: cGFzc3dvcmQ=

---
# ============================================================
# Secret: TLS certificate (self-signed placeholder)
# Replace tls.crt and tls.key with real base64-encoded values:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout tls.key -out tls.crt -subj "/CN=siproquim.local"
#   cat tls.crt | base64 | tr -d '\n'
#   cat tls.key | base64 | tr -d '\n'
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: siproquim-tls
  namespace: siproquim
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 

---
# ============================================================
# ConfigMap: application environment variables
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: siproquim-config
  namespace: siproquim
data:
  DB_HOST: "postgres.siproquim.svc.cluster.local"
  DB_NAME: "estoque"
  DB_PORT: "5432"

---
# ============================================================
# ConfigMap: nginx reverse-proxy configuration
# Proxies plain HTTP to siproquim-php:80.
# TLS is terminated at the Ingress — no SSL config here.
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: siproquim
data:
  default.conf: |
    server {
        listen 80;
        server_name siproquim.local;

        location / {
            proxy_pass http://siproquim-php:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

---
# ============================================================
# PersistentVolumeClaim: PostgreSQL data directory
# Uses the cluster default StorageClass (minikube: standard)
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: siproquim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# ============================================================
# StatefulSet: PostgreSQL 15
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: siproquim
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: siproquim-db-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: siproquim-db-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: siproquim-config
                  key: DB_NAME
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "admin"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "admin"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc

---
# ============================================================
# Service: headless — gives stable DNS postgres.siproquim.svc.cluster.local
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: siproquim
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
# ============================================================
# Deployment: PHP 8.4 Apache application
# Image built from project Dockerfile: docker build -t siproquim-php:latest .
# Load into minikube: minikube image load siproquim-php:latest
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siproquim-php
  namespace: siproquim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siproquim-php
  template:
    metadata:
      labels:
        app: siproquim-php
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z postgres.siproquim.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done"
      containers:
        - name: php
          image: siproquim-php:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: siproquim-config
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: siproquim-config
                  key: DB_NAME
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: siproquim-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: siproquim-db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: siproquim-db-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

---
# ============================================================
# Service: PHP app — ClusterIP, port 80
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: siproquim-php
  namespace: siproquim
spec:
  selector:
    app: siproquim-php
  ports:
    - port: 80
      targetPort: 80

---
# ============================================================
# Deployment: Nginx reverse proxy
# Mounts nginx-config ConfigMap as /etc/nginx/conf.d/default.conf
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siproquim-nginx
  namespace: siproquim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siproquim-nginx
  template:
    metadata:
      labels:
        app: siproquim-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config

---
# ============================================================
# Service: Nginx — ClusterIP, port 80
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: siproquim-nginx
  namespace: siproquim
spec:
  selector:
    app: siproquim-nginx
  ports:
    - port: 80
      targetPort: 80

---
# ============================================================
# Ingress: TLS termination at nginx ingress controller
# Prerequisite: minikube addons enable ingress
# Local access: echo "$(minikube ip) siproquim.local" | sudo tee -a /etc/hosts
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: siproquim
  namespace: siproquim
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - siproquim.local
      secretName: siproquim-tls
  rules:
    - host: siproquim.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: siproquim-nginx
                port:
                  number: 80
